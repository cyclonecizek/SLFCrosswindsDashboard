name: Check live wind dashboard
on:
  push:
    branches: [main]
    paths: ["index.html", "live-data.mjs", "tests/**", ".github/workflows/test.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
